{{- if not (has .Values.bus.kind (list "direct" "nats")) }}{{ fail "bus.kind is direct or nats" }}{{ end -}}
{{- if eq .Values.bus.kind "nats" }}
{{- if not (regexMatch "^(tls|nats)://[^/ ]+$" (toString .Values.bus.nats.url)) }}{{ fail "bus.nats.url must be tls://host:port (or nats://)" }}{{ end -}}
{{- if not .Values.bus.nats.existingSecret }}{{ fail "bus.nats.existingSecret is required with bus.kind nats (tls.crt, tls.key, ca.crt)" }}{{ end -}}
{{- end }}
{{- with .Values.apiURL }}{{ if not (regexMatch "^https://[^/ ]+$" .) }}{{ fail "apiURL must be https://host[:port] with no path" }}{{ end }}{{ end -}}
{{- range .Values.serverNames }}{{ if not (regexMatch "^[A-Za-z0-9.:-]+$" (toString .)) }}{{ fail (printf "serverNames: %q is not a host name or an address" .) }}{{ end }}{{ end -}}
{{- if and (eq .Values.service.type "LoadBalancer") (empty .Values.serverNames) }}{{ fail "serverNames must name the load balancer's address (or a DNS name for it): nodes check the certificate against it" }}{{ end -}}
{{- if has (int .Values.metrics.port) (list 7878 7879) }}{{ fail "metrics.port must not be 7878 or 7879: those are the node protocol and the operator API" }}{{ end -}}
{{- if and .Values.grpc.enabled (has (int .Values.grpc.port) (list 7878 7879 (int .Values.metrics.port))) }}{{ fail "grpc.port must not be 7878, 7879 or metrics.port" }}{{ end -}}
{{- if not (has (toString .Values.logFormat) (list "text" "json")) }}{{ fail "logFormat is text or json" }}{{ end -}}
{{- with .Values.tracing.otlpEndpoint }}{{ if not (regexMatch "^https?://[^/ ]+(/[^ ]*)?$" .) }}{{ fail "tracing.otlpEndpoint must be http://host:port or https://host:port (OTLP/HTTP; the port is 4318 on a collector or Tempo)" }}{{ end }}{{ end -}}
{{- if and .Values.tempo.enabled .Values.tempo.persistence.enabled (not .Values.tempo.persistence.size) (not .Values.tempo.persistence.existingClaim) }}{{ fail "tempo.persistence needs a size or an existingClaim" }}{{ end -}}
