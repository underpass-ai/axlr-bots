{{- if .Values.serviceAccount.create }}
# No API rights: the control plane never talks to Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "axlr-bots-control-plane.serviceAccountName" . }}
  labels:
    {{- include "axlr-bots-control-plane.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
