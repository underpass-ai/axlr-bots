{{- if .Values.tempo.enabled }}
# In the cluster only: the control plane sends traces to otlp-http, and
# Grafana reads them from http (a Tempo data source, port 3200).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axlr-bots-control-plane.tempoName" . }}
  labels:
    {{- include "axlr-bots-control-plane.tempoLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "axlr-bots-control-plane.tempoSelectorLabels" . | nindent 4 }}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http, protocol: TCP}
    - {name: http, port: 3200, targetPort: http, protocol: TCP}
{{- end }}
