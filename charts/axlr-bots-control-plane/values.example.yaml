# A control plane behind a load balancer with a fixed address, the model
# keys from a Secret, and a NATS broker for the pushes. The names are
# examples: put your own address and Secrets.
serverNames: [192.0.2.10, axlr.example.internal]
grpcURL: 192.0.2.10:7880

apiToken:
  existingSecret: axlr-bots-api-token

env:
  existingSecret: axlr-bots-env

bus:
  kind: nats
  nats:
    url: tls://nats.axlr-bots.svc:4222
    existingSecret: axlr-bots-nats-client

service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: 192.0.2.10
