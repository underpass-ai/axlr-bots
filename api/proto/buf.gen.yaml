version: v2
# The generator plugins are the `tool` directives of go.mod, so their
# versions are pinned there and the output does not depend on what is
# installed on the machine.
plugins:
  - local: [go, tool, protoc-gen-go]
    out: ../gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-go-grpc]
    out: ../gen
    opt: paths=source_relative
