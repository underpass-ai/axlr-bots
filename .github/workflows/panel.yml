name: Panel

# The desktop panel in panel/ (Rust). Its jobs run when the panel changes, or
# when what it reads changes: the operator API's server, its reference and its
# contract. A pull request carries no path filter: `panel-gate` is a check
# branch protection requires, so it has to report on every one, and `changes`
# decides what the rest does with the same paths as the push filter.
on:
  push:
    branches: [main]
    paths:
      - panel/**
      - adapters/unixapi/**
      - docs/reference/operator-api.md
      - docs/reference/operator-api.json
      - .github/workflows/panel.yml
  pull_request:

concurrency:
  group: panel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: panel

jobs:
  # Whether a pull request changes the panel or what it reads. A push to main
  # has already passed the path filter above.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
      - name: Changed paths
        id: paths
        shell: bash
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
            grep -qE '^(panel/|adapters/unixapi/|docs/reference/operator-api\.(md|json)$|\.github/workflows/panel\.yml$)' "$RUNNER_TEMP/changed" || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # panel/.cargo/config.toml keeps gx10 at two jobs; a runner has four cores.
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  deny:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: panel/Cargo.toml
          command: check

  # The check branch protection requires from this workflow. It reports on
  # every pull request and passes only when no job above failed; a job the
  # change does not reach is skipped, and that is a pass.
  panel-gate:
    if: always()
    needs: [changes, rust, deny]
    runs-on: ubuntu-latest
    steps:
      - name: No job failed
        shell: bash
        # Nothing is checked out here, so panel/ does not exist.
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
