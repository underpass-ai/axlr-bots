name: CI

# The panel has its own workflow (panel.yml); a change to panel/ alone runs
# nothing here.
on:
  push:
    branches: [main]
    paths-ignore:
      - panel/**
      - .github/workflows/panel.yml
  pull_request:
    paths-ignore:
      - panel/**
      - .github/workflows/panel.yml

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Race tests with coverage
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage gate (80 % total)
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total coverage: ${coverage}%"
          awk -v value="$coverage" 'BEGIN { exit !(value >= 80) }'

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint, render and refuse what is wrong
        shell: bash
        run: |
          set -euo pipefail
          chart=charts/axlr-bots-node
          example=$chart/values.example.yaml
          cmp LICENSE $chart/LICENSE
          cmp NOTICE $chart/NOTICE
          helm lint $chart
          helm lint $chart -f $example
          # Without the demo the chart renders nothing: it is a dependency.
          test -z "$(helm template test $chart | grep '^kind:' || true)"
          helm template test $chart -f $example > rendered.yaml
          for kind in StatefulSet Service ServiceAccount NetworkPolicy Pod; do grep -q "^kind: $kind$" rendered.yaml; done
          refused() {
            if helm template test $chart -f $example "$@" >/dev/null 2>&1; then
              echo "accepted: $*" >&2
              exit 1
            fi
          }
          for field in image.digest controlPlane.url enrollment.existingSecret model.apiKey.existingSecret; do
            refused --set-string "$field="
          done
          refused --set-string image.digest=sha256:abc
          refused --set-string controlPlane.url=http://192.168.1.75:7878
          refused --set-string node.labels.Zone=eu
          refused --set-string node.idPrefix=Bad
          refused --set demo.replicas=0
          refused --set 'sidecar.workspaces[0].bot=Bad,sidecar.workspaces[0].volume=v'
          refused --set-string controlPlane.url=https://cp.example.internal:7878
          helm template test $chart -f $example --set-string controlPlane.url=https://cp.example.internal:7878 --set-string networkPolicy.controlPlaneCIDR=10.0.0.5/32 >/dev/null
          ! helm template test $chart -f $example --set networkPolicy.enabled=false | grep -q '^kind: NetworkPolicy$'
          # The HTTPS service with mutual TLS: cert-manager's certificates, or Secrets given.
          https="--set demo.https.enabled=true --set-string demo.https.host=demo.example.com"
          helm template test $chart -f $example $https --set demo.https.certManager.enabled=true --set-string demo.https.certManager.serverIssuer.name=acme > https.yaml
          test "$(grep -c '^kind: Certificate$' https.yaml)" = 3
          grep -q 'ssl_verify_client on;' https.yaml
          grep -q 'type: LoadBalancer' https.yaml
          ! helm template test $chart -f $example $https --set-string demo.https.serverTLS.existingSecret=tls --set-string demo.https.clientCA.existingSecret=ca | grep -q '^kind: Certificate$'
          refused $https
          refused --set demo.https.enabled=true --set demo.https.certManager.enabled=true --set-string demo.https.certManager.serverIssuer.name=acme
          refused $https --set demo.https.certManager.enabled=true
          refused $https --set-string demo.https.host=Bad_Host
      - name: Include the sidecar from another chart
        shell: bash
        run: |
          set -euo pipefail
          helm dependency update examples/helm/service-with-bots
          helm lint examples/helm/service-with-bots
          helm template web examples/helm/service-with-bots > inject.yaml
          grep -q 'name: axlr-node$' inject.yaml
          grep -q 'mountPath: /var/lib/axlr-node/workspaces/log-summariser' inject.yaml
      - name: Render the drone fleet example
        shell: bash
        run: |
          set -euo pipefail
          helm dependency update examples/helm/drone-fleet
          helm lint examples/helm/drone-fleet
          # One fleet: the port's patrols and the search, the AIS receiver of its own.
          helm template fleet examples/helm/drone-fleet -n port-fleet > fleet.yaml
          test "$(grep -c '^kind: StatefulSet$' fleet.yaml)" = 7
          test "$(grep -c '^kind: Deployment$' fleet.yaml)" = 1
          grep -q 'value: "https://fleet-cp:7878"' fleet.yaml
          grep -q 'value: "https://fleet-cp:7879"' fleet.yaml
          grep -q 'value: "http://ais:8080"' fleet.yaml
          grep -q 'command: \["python", "/app/ais.py"\]' fleet.yaml
          grep -q 'app.kubernetes.io/name: ais' fleet.yaml
          grep -q 'value: "sar-dispatcher"' fleet.yaml
          grep -q 'value: "logistics-demo"' fleet.yaml
          grep -q 'reporter/fleet.json' fleet.yaml
          grep -q 'SIM_BATT_CAP_AH 10' fleet.yaml
          test "$(grep -c 'name: TELEMETRY_DIR' fleet.yaml)" = 5
          helm template fleet examples/helm/drone-fleet --set base.ingress.enabled=true --set base.ingress.host=fleet.example.com \
            --set 'base.ingress.extraHosts={sar.example.com}' > ingress.yaml
          grep -q '^kind: Ingress$' ingress.yaml
          grep -q 'secretName: fleet-base-sar-example-com-tls' ingress.yaml
          # Without the search and AIS: no operator API in the base, no receiver.
          helm template fleet examples/helm/drone-fleet --set incident.enabled=false --set ais.enabled=false > plain.yaml
          ! grep -q -E 'CP_URL|AIS_URL|^kind: Deployment$' plain.yaml
          # The gz world: off by default; on, one pod, its Service, its policy, SITL on JSON.
          ! grep -q -E 'fleet-gz|GZ_HOST' fleet.yaml
          helm template fleet examples/helm/drone-fleet -n port-fleet --set gz.enabled=true > gz.yaml
          test "$(grep -c '^kind: Deployment$' gz.yaml)" = 2
          grep -q 'name: fdm-supply-0, port: 9052' gz.yaml
          test "$(grep -c 'name: GZ_HOST, value: fleet-gz' gz.yaml)" = 3
          grep -q '/etc/sitl/rover.parm,/etc/sitl/rover-gz.parm' gz.yaml
          grep -q 'name: fleet-gz$' gz.yaml
          ! grep -q 'nvidia.com/gpu' gz.yaml
          helm template fleet examples/helm/drone-fleet -n port-fleet --set gz.enabled=true --set gz.gpu=true > gpu.yaml
          grep -q 'nvidia.com/gpu: 1' gpu.yaml
          grep -q 'runtimeClassName: nvidia' gpu.yaml

  fleet-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test the port fleet's services
        working-directory: examples/drone-fleet/app
        run: |
          pip install pymavlink==2.4.50 pillow==12.0.0 websockets==15.0.1
          PHOTOS_DIR=$(mktemp -d) python -m unittest -v test_fleet
      - name: Test the fleet's gz scripts
        working-directory: examples/drone-fleet/gz
        run: python -m unittest -v test_gz
      - name: Test the world adapter template
        working-directory: examples/world-adapter
        run: python -m unittest -v test_adapter
      - name: Test the orchestra's stop measurement
        working-directory: examples/orchestra/stage
        run: python -m unittest -v test_measure_stop
      - name: Test the orchestra's score service
        working-directory: examples/orchestra/score-service
        run: |
          pip install mido==1.3.3
          python -m unittest -v test_score_service

  node-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the node image for amd64 and arm64
        run: |
          docker buildx create --use --name multi
          docker buildx build -f distribution/node.Dockerfile --platform linux/amd64,linux/arm64 .
      - name: Run it
        run: |
          docker buildx build -f distribution/node.Dockerfile --platform linux/amd64 -t axlr-bots-node:ci --load .
          docker run --rm --read-only axlr-bots-node:ci --help 2>&1 | grep -q 'axlr-node check'
          test "$(docker run --rm --read-only --entrypoint /usr/local/bin/axlr-tui axlr-bots-node:ci --version 2>&1)" = "$(sed -n 's/^ARG AXLR_VERSION=//p' distribution/node.Dockerfile)"
