name: CI

# The panel has its own workflow (panel.yml); a change to panel/ alone runs
# no job here but `changes` and `gate`. A pull request carries no path filter:
# `gate` is a check branch protection requires, so it has to report on every
# one, and `changes` decides what the rest does.
on:
  push:
    branches: [main]
    paths-ignore:
      - panel/**
      - .github/workflows/panel.yml
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What a pull request changes outside the panel. A push to main has already
  # passed the path filter above.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
      - name: Changed paths
        id: paths
        shell: bash
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
            grep -qvE '^(panel/|\.github/workflows/panel\.yml$)' "$RUNNER_TEMP/changed" || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Operator API contract is generated and clean
        run: |
          # buf lints the .proto files and regenerates api/gen with the
          # plugins pinned in go.mod; any difference means the generated
          # code was not regenerated (make proto).
          go generate ./api/proto
          test -z "$(git status --porcelain -- api)" || { git status --short -- api; git diff -- api | head -50; exit 1; }
      - name: Vet
        run: go vet ./... && go vet -tags sqlite ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build
        run: |
          # Without the sqlite tag the control plane keeps transcripts in
          # plain files and needs no cgo; with it, in SQLite.
          CGO_ENABLED=0 go build ./...
          go build -tags sqlite ./...
      - name: SQLite transcripts store (the sqlite build tag)
        run: go test -race -count=1 -tags sqlite ./adapters/sqlitestore ./compose ./adapters/unixapi ./adapters/nodeagent ./cmd/axlr-bots
      - name: Race tests with coverage
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out ./... | tee test.log
      - name: Coverage gate (80 % per package)
        run: |
          go tool cover -func=coverage.out | tail -n 1
          # Every package on its own, so a well-tested one cannot hide one
          # that is not. bustest is a helper the bus tests import; it has
          # no tests of its own, and api/gen is generated code, checked by
          # the contract step and exercised in api/proto.
          awk '
            match($0, /coverage: [0-9.]+% of statements/) {
              pkg = ""
              for (i = 1; i <= NF; i++) if ($i ~ /^github\.com\//) pkg = $i
              if (pkg ~ /\/adapters\/bus\/bustest$/) next
              if (pkg ~ /\/api\/gen\//) next
              value = substr($0, RSTART + 10, index(substr($0, RSTART), "%") - 11)
              checked++
              if (value + 0 < 80) { printf "%s: %s%%, below 80%%\n", pkg, value; low = 1 }
            }
            END { if (!checked) { print "no package coverage in the log"; exit 1 } exit low }
          ' test.log

  chart:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint, render and refuse what is wrong
        shell: bash
        run: |
          set -euo pipefail
          chart=charts/axlr-bots-node
          example=$chart/values.example.yaml
          cmp LICENSE $chart/LICENSE
          cmp NOTICE $chart/NOTICE
          helm lint $chart
          helm lint $chart -f $example
          # Without the demo the chart renders nothing: it is a dependency.
          test -z "$(helm template test $chart | grep '^kind:' || true)"
          helm template test $chart -f $example > rendered.yaml
          for kind in StatefulSet Service ServiceAccount NetworkPolicy Pod; do grep -q "^kind: $kind$" rendered.yaml; done
          refused() {
            if helm template test $chart -f $example "$@" >/dev/null 2>&1; then
              echo "accepted: $*" >&2
              exit 1
            fi
          }
          for field in image.digest controlPlane.url enrollment.existingSecret model.apiKey.existingSecret; do
            refused --set-string "$field="
          done
          refused --set-string image.digest=sha256:abc
          refused --set-string controlPlane.url=http://192.168.1.75:7878
          refused --set-string node.labels.Zone=eu
          refused --set-string node.idPrefix=Bad
          refused --set demo.replicas=0
          refused --set 'sidecar.workspaces[0].bot=Bad,sidecar.workspaces[0].volume=v'
          # A Jev bot's mcp.json from a ConfigMap: read-only, named by AXLR_NODE_MCP_CONFIG.
          ! grep -q AXLR_NODE_MCP_CONFIG rendered.yaml
          helm template test $chart -f $example --set sidecar.mcp.existingConfigMap=bots-mcp > mcp.yaml
          grep -q 'value: /etc/axlr-node/mcp/mcp.json' mcp.yaml
          grep -q 'mountPath: /etc/axlr-node/mcp, readOnly: true' mcp.yaml
          grep -q 'items: \[{key: "mcp.json", path: mcp.json}\]' mcp.yaml
          refused --set sidecar.mcp.existingConfigMap=bots-mcp --set-string sidecar.mcp.key=
          refused --set-string controlPlane.url=https://cp.example.internal:7878
          helm template test $chart -f $example --set-string controlPlane.url=https://cp.example.internal:7878 --set-string networkPolicy.controlPlaneCIDR=10.0.0.5/32 >/dev/null
          # A control plane in the same cluster: its pods are a peer too, and a Service name needs no CIDR.
          helm template test $chart -f $example --set-string networkPolicy.controlPlanePods.namespace=axlr-bots > cp-pods.yaml
          grep -q 'kubernetes.io/metadata.name: axlr-bots' cp-pods.yaml
          grep -q 'app.kubernetes.io/name: axlr-bots-control-plane' cp-pods.yaml
          helm template test $chart -f $example --set-string controlPlane.url=https://cp.axlr-bots.svc:7878 --set-string networkPolicy.controlPlanePods.namespace=axlr-bots >/dev/null
          refused --set-string networkPolicy.controlPlanePods.namespace=Bad_NS
          ! helm template test $chart -f $example --set networkPolicy.enabled=false | grep -q '^kind: NetworkPolicy$'
          # The HTTPS service with mutual TLS: cert-manager's certificates, or Secrets given.
          https="--set demo.https.enabled=true --set-string demo.https.host=demo.example.com"
          helm template test $chart -f $example $https --set demo.https.certManager.enabled=true --set-string demo.https.certManager.serverIssuer.name=acme > https.yaml
          test "$(grep -c '^kind: Certificate$' https.yaml)" = 3
          grep -q 'ssl_verify_client on;' https.yaml
          grep -q 'type: LoadBalancer' https.yaml
          ! helm template test $chart -f $example $https --set-string demo.https.serverTLS.existingSecret=tls --set-string demo.https.clientCA.existingSecret=ca | grep -q '^kind: Certificate$'
          refused $https
          refused --set demo.https.enabled=true --set demo.https.certManager.enabled=true --set-string demo.https.certManager.serverIssuer.name=acme
          refused $https --set demo.https.certManager.enabled=true
          refused $https --set-string demo.https.host=Bad_Host
      - name: Control plane chart
        shell: bash
        run: |
          set -euo pipefail
          chart=charts/axlr-bots-control-plane
          example=$chart/values.example.yaml
          cmp LICENSE $chart/LICENSE
          cmp NOTICE $chart/NOTICE
          helm lint $chart
          helm lint $chart -f $example
          helm template test $chart > default.yaml
          for kind in Deployment Service ServiceAccount PersistentVolumeClaim; do grep -q "^kind: $kind$" default.yaml; done
          # One pod, stopped before the next starts: the state lock refuses two.
          grep -q 'replicas: 1$' default.yaml
          grep -q 'type: Recreate' default.yaml
          grep -q 'helm.sh/resource-policy: keep' default.yaml
          ! grep -q 'name: ca-init' default.yaml
          helm template test $chart -f $example > example.yaml
          grep -q -- '--api-token-file=/etc/axlr-bots/api/token' example.yaml
          grep -q 'value: "192.0.2.10,axlr.example.internal,test-axlr-bots-control-plane,' example.yaml
          grep -q 'name: AXLR_BOTS_NATS_CERT, value: /etc/axlr-bots/nats/tls.crt' example.yaml
          grep -q 'type: LoadBalancer' example.yaml
          helm template test $chart --set persistence.existingClaim=state | grep -q 'claimName: state'
          ! helm template test $chart --set persistence.existingClaim=state | grep -q '^kind: PersistentVolumeClaim$'
          helm template test $chart --set ca.init=true | grep -q 'name: ca-init'
          # Metrics, the PodMonitor and the dashboard are off by default.
          ! grep -q 'AXLR_BOTS_METRICS_LISTEN' default.yaml
          ! grep -q '^kind: PodMonitor$' default.yaml
          helm template test $chart --set metrics.enabled=true --set metrics.podMonitor.enabled=true --set grafanaDashboard.enabled=true --set logFormat=json > observability.yaml
          grep -q 'name: AXLR_BOTS_METRICS_LISTEN, value: "0.0.0.0:9464"' observability.yaml
          grep -q 'name: metrics, containerPort: 9464' observability.yaml
          grep -q '^kind: PodMonitor$' observability.yaml
          grep -q 'grafana_dashboard: "1"' observability.yaml
          grep -q 'name: AXLR_BOTS_LOG_FORMAT, value: "json"' observability.yaml
          # A team's topics: off by default; nats sets the env and mounts the
          # broker's Secret, whatever bus.kind is.
          grep -q 'name: AXLR_BOTS_TOPICS, value: "off"' default.yaml
          helm template test $chart --set topics=nats --set-string bus.nats.url=tls://nats:4222 --set-string bus.nats.existingSecret=nats-client > topics.yaml
          grep -q 'name: AXLR_BOTS_TOPICS, value: "nats"' topics.yaml
          grep -q 'name: AXLR_BOTS_BUS, value: "direct"' topics.yaml
          grep -q 'name: AXLR_BOTS_NATS_CERT, value: /etc/axlr-bots/nats/tls.crt' topics.yaml
          refused() {
            if helm template test $chart "$@" >/dev/null 2>&1; then
              echo "accepted: $*" >&2
              exit 1
            fi
          }
          refused --set service.type=LoadBalancer
          refused --set bus.kind=nats
          refused --set bus.kind=nats --set-string bus.nats.url=tls://nats:4222
          refused --set bus.kind=kafka
          refused --set topics=nats
          refused --set topics=kafka
          refused --set-string apiURL=http://192.0.2.10:7879
          refused --set-string apiURL=https://192.0.2.10:7879/path
          refused --set-string 'serverNames={bad name}'
          refused --set-string image.digest=sha256:abc
          refused --set metrics.port=7879
          refused --set-string logFormat=yaml

  node-image:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the node image for amd64 and arm64
        run: |
          docker buildx create --use --name multi
          docker buildx build -f distribution/node.Dockerfile --platform linux/amd64,linux/arm64 --build-arg VERSION=0.0.0-ci --build-arg REVISION="$GITHUB_SHA" .
      - name: Run it
        run: |
          docker buildx build -f distribution/node.Dockerfile --platform linux/amd64 -t axlr-bots-node:ci --load .
          docker run --rm --read-only axlr-bots-node:ci --help 2>&1 | grep -q 'axlr-node check'
          test "$(docker run --rm --read-only --entrypoint /usr/local/bin/axlr-tui axlr-bots-node:ci --version 2>&1)" = "$(sed -n 's/^ARG AXLR_VERSION=//p' distribution/node.Dockerfile)"

  control-plane-image:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Both images pin the same AXLR
        run: |
          pins() { grep -E '^ARG AXLR_(VERSION|SHA256_[A-Z0-9]+)=' "$1"; }
          diff <(pins distribution/node.Dockerfile) <(pins distribution/control-plane.Dockerfile)
      - name: Build the control plane image for amd64 and arm64
        run: |
          docker buildx create --use --name multi
          docker buildx build -f distribution/control-plane.Dockerfile --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=0.0.0-ci --build-arg REVISION="$GITHUB_SHA" .
      - name: Run it
        run: |
          docker buildx build -f distribution/control-plane.Dockerfile --platform linux/amd64 \
            --build-arg VERSION=0.0.0-ci --build-arg REVISION="$GITHUB_SHA" --build-arg BUILD_TIME=2026-01-01T00:00:00Z \
            -t ghcr.io/underpass-ai/axlr-bots:0.0.0-ci --load .
          image=ghcr.io/underpass-ai/axlr-bots:0.0.0-ci
          docker run --rm --read-only "$image" version | tee version.txt
          grep -qx "axlr-bots 0.0.0-ci ($GITHUB_SHA 2026-01-01T00:00:00Z)" version.txt
          test "$(docker run --rm --read-only --entrypoint /usr/local/bin/axlr-tui "$image" --version 2>&1)" = "$(sed -n 's/^ARG AXLR_VERSION=//p' distribution/control-plane.Dockerfile)"
          test "$(docker inspect -f '{{.Config.User}}' "$image")" = 65532:65532
      - name: Serve it with compose
        shell: bash
        run: |
          set -euo pipefail
          # A short path: a Unix socket's path has at most 107 bytes.
          root=$(mktemp -d /tmp/acp.XXXX)
          mkdir -p "$root/state" "$root/config"
          export AXLR_BOTS_VERSION=0.0.0-ci AXLR_BOTS_UID=$(id -u) AXLR_BOTS_GID=$(id -g) \
            AXLR_BOTS_STATE_DIR="$root/state" AXLR_BOTS_CONFIG="$root/config" \
            AXLR_BOTS_LISTEN=127.0.0.1:17878 AXLR_BOTS_API_LISTEN=127.0.0.1:17879
          compose="docker compose -p axlr-bots-ci -f distribution/compose.yaml"
          $compose config --quiet
          # Without a version the file refuses to start.
          if env -u AXLR_BOTS_VERSION docker compose -f distribution/compose.yaml config --quiet 2>/dev/null; then
            echo "compose accepted no AXLR_BOTS_VERSION" >&2
            exit 1
          fi
          $compose run --rm control-plane ca init >/dev/null
          $compose up -d
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' axlr-bots-ci-control-plane-1)
            [ "$status" = healthy ] && break
            sleep 2
          done
          $compose logs
          test "$status" = healthy
          test -S "$root/state/axlr-bots.sock"
          test "$(stat -c %u "$root/state/api.token")" = "$(id -u)"
          curl -fsk https://127.0.0.1:17879/healthz
          curl -fsk -H "Authorization: Bearer $(cat "$root/state/api.token")" https://127.0.0.1:17879/v1/build | tee build.json
          grep -q '"running":{"version":"0.0.0-ci"' build.json
          # The installed binary's stamp is read from the file: a build with
          # -trimpath records no -ldflags and this would be empty.
          grep -q '"installed":{"version":"0.0.0-ci"' build.json
          grep -q '"stale":false' build.json
          $compose down

  # The check branch protection requires from this workflow. It reports on
  # every pull request and passes only when no job above failed; a job the
  # change does not reach is skipped, and that is a pass.
  gate:
    if: always()
    needs: [changes, go, chart, node-image, control-plane-image]
    runs-on: ubuntu-latest
    steps:
      - name: No job failed
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
