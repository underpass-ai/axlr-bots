name: Release

# A tag vX.Y.Z publishes the release's containers and binaries:
#
#   ghcr.io/underpass-ai/axlr-bots:X.Y.Z        the control plane (distribution/control-plane.Dockerfile)
#   ghcr.io/underpass-ai/axlr-bots-node:X.Y.Z   the node (distribution/node.Dockerfile)
#   axlr-bots-vX.Y.Z-linux-<arch>.tar.gz       axlr-bots and axlr-node, on the GitHub release
#   axlr-bots-panel-vX.Y.Z-linux-<arch>.tar.gz the desktop panel (panel/), on the GitHub release
#
# Images, binaries and the panel are linux/amd64 and linux/arm64. The
# version is stamped without its v (internal/buildinfo): it is what
# GET /v1/build answers and the reference the panel compares nodes and
# bots with. The release notes stay the maintainer's: a release that does
# not exist yet is created as a draft, one that exists gets these assets
# replaced and their lines in SHA256SUMS replaced, other lines kept.
#
# workflow_dispatch is a dry run: it builds the binaries and the panel of
# the dispatched ref, named after the `tag` input, and prints the
# SHA256SUMS the publish job would write against that tag's release. It
# pushes no image and creates, uploads or changes no release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag whose names and release the dry run uses (vX.Y.Z); nothing is published"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      time: ${{ steps.tag.outputs.time }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The tag is a semantic version
        id: tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          [[ "$TAG" =~ $semver ]] || { echo "tag $TAG is not vMAJOR.MINOR.PATCH[-prerelease]" >&2; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # The commit's time in UTC, as Go writes vcs.time in a binary built in a checkout.
          echo "time=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    # A dry run pushes no image.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: distribution/control-plane.Dockerfile
            image: ghcr.io/underpass-ai/axlr-bots
          - dockerfile: distribution/node.Dockerfile
            image: ghcr.io/underpass-ai/axlr-bots-node
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push for amd64 and arm64
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_TIME: ${{ needs.version.outputs.time }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker buildx create --use --name multi
          docker buildx build -f "$DOCKERFILE" --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" --build-arg BUILD_TIME="$BUILD_TIME" \
            --tag "$IMAGE:$VERSION" --metadata-file metadata.json --push .
          digest=$(python3 -c 'import json; print(json.load(open("metadata.json"))["containerimage.digest"])')
          echo "$IMAGE:$VERSION@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The published image answers its version
        if: matrix.image == 'ghcr.io/underpass-ai/axlr-bots'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_TIME: ${{ needs.version.outputs.time }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm --read-only "$IMAGE:$VERSION" version | tee version.txt
          grep -qx "axlr-bots $VERSION ($GITHUB_SHA $BUILD_TIME)" version.txt

  binaries:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: C cross compiler for arm64
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build axlr-bots and axlr-node
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_TIME: ${{ needs.version.outputs.time }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # The images' flags: no -trimpath, so the daemon reads its stamp
          # back from the installed binary (internal/buildinfo).
          pkg=github.com/underpass-ai/axlr-bots/internal/buildinfo
          ldflags="-s -w -X $pkg.Version=$VERSION -X $pkg.Revision=$GITHUB_SHA -X $pkg.Time=$BUILD_TIME"
          # Outside the checkout: a file in it would make the second build
          # record vcs.modified, "with changes".
          dist="$RUNNER_TEMP/dist"
          dir="axlr-bots-v$VERSION-linux-$GOARCH"
          mkdir -p "$dist/$dir"
          # axlr-bots is built with the sqlite tag, SQLite through cgo (the transcripts' store,
          # docs/architecture/transcripts.md), statically, as the image
          # does; axlr-node stays pure Go.
          cc=gcc
          if [ "$GOARCH" = arm64 ]; then cc=aarch64-linux-gnu-gcc; fi
          CGO_ENABLED=1 CC=$cc GOOS=linux go build -tags "sqlite sqlite_omit_load_extension netgo osusergo" \
            -ldflags="$ldflags -linkmode external -extldflags -static" -o "$dist/$dir/axlr-bots" ./cmd/axlr-bots
          CGO_ENABLED=0 GOOS=linux go build -ldflags="$ldflags" -o "$dist/$dir/axlr-node" ./cmd/axlr-node
          cp LICENSE NOTICE "$dist/$dir/"
          if [ "$GOARCH" = amd64 ]; then
            "$dist/$dir/axlr-bots" version | tee "$dist/version.txt"
            grep -qx "axlr-bots $VERSION ($GITHUB_SHA $BUILD_TIME)" "$dist/version.txt"
          fi
          tar -C "$dist" -czf "$dist/$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  # The desktop panel, built natively on each architecture's runner: ring
  # (rustls) compiles C, and a native build needs no cross toolchain and
  # can run the binary it made. The panel links only glibc; X11, Wayland
  # and the GPU drivers are opened at run time, so the runner needs no
  # system libraries (panel.yml builds and tests it on ubuntu-latest with
  # none installed).
  # The images are pinned, not -latest: the binary needs the runner's
  # glibc (2.39 on 24.04, as on the hosts it is built for by hand).
  panel:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      # panel/.cargo/config.toml keeps gx10 at two jobs; a runner has four cores.
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build axlr-bots-panel
        shell: bash
        working-directory: panel
        run: cargo build --release --locked
      - name: Package axlr-bots-panel
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          dir="axlr-bots-panel-v$VERSION-linux-$ARCH"
          mkdir -p "$dist/$dir"
          install -m 755 panel/target/release/axlr-bots-panel "$dist/$dir/axlr-bots-panel"
          cp LICENSE NOTICE "$dist/$dir/"
          # It starts and answers without a display. It prints the crate's
          # version, not the tag's.
          "$dist/$dir/axlr-bots-panel" --version | tee "$dist/panel-version.txt"
          grep -q '^axlr-bots-panel ' "$dist/panel-version.txt"
          tar -C "$dist" -czf "$dist/$dir.tar.gz" "$dir"
          tar -tzvf "$dist/$dir.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-panel-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, images, binaries, panel]
    # images is skipped only in a dry run, where this job publishes nothing.
    if: >-
      !cancelled() && needs.version.result == 'success' && needs.binaries.result == 'success'
      && needs.panel.result == 'success'
      && (needs.images.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.images.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ github.event_name != 'push' }}
        run: |
          set -euo pipefail
          cd dist
          exists=true
          gh release view "$TAG" >/dev/null 2>&1 || exists=false
          if [ "$exists" = false ] && [ "$DRY_RUN" = false ]; then
            gh release create "$TAG" --draft --verify-tag --title "AXLR Bots $TAG" \
              --notes "Draft created by the release workflow: the containers, binaries and the panel's archive are attached; the notes are still to be added."
            exists=true
          fi
          # SHA256SUMS keeps the lines of assets this job does not make and
          # replaces those it does, the panel's archives among them.
          : > SHA256SUMS
          if [ "$exists" = true ]; then
            gh release download "$TAG" --pattern SHA256SUMS --output SHA256SUMS --clobber 2>/dev/null || : > SHA256SUMS
          fi
          ours=$(ls axlr-bots-v*-linux-*.tar.gz axlr-bots-panel-v*-linux-*.tar.gz)
          awk 'NR == FNR { ours[$0]; next } !($2 in ours)' <(printf '%s\n' $ours) SHA256SUMS > sums.keep
          sha256sum $ours >> sums.keep
          sort -k2 sums.keep > SHA256SUMS
          cat SHA256SUMS
          if [ "$DRY_RUN" = true ]; then
            {
              echo "Dry run for $TAG: nothing was uploaded. SHA256SUMS would be:"
              echo '```'
              cat SHA256SUMS
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release upload "$TAG" $ours SHA256SUMS --clobber
