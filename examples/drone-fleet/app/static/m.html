<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF8">
<title>Approvals · AXLR Bots</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="theme.css">
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;})();</script>
<style>
  html, body { font-size: 18px; }
  body { padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .sim { position: static; border: 1px solid var(--sim); border-radius: 8px; margin-bottom: 12px; }
  header { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
  header .brand { flex: 1; }
  header .brand img { height: 48px; }
  #incident { margin-bottom: 12px; }
  #incident[hidden] { display: none; }
  .card { border: 1px solid var(--warn); border-radius: 14px; padding: 12px; margin-bottom: 14px; }
  .card .who { font-size: 22px; font-weight: 700; flex: 1; }
  .left { font: 400 18px/1.2 var(--num); font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 6px; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); color: var(--warn); border: 1px solid var(--warn); white-space: nowrap; }
  .left.late { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--bad); border-color: var(--bad); }
  .mission { font-size: 19px; font-weight: 600; margin-top: 6px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
  .facts div { background: var(--page); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 17px; }
  .facts span { display: block; font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .why { color: var(--muted); font-size: 16px; margin: 4px 0 8px; }
  .mini { height: 190px; border-radius: 10px; border: 1px solid var(--line); background: #0d1117; overflow: hidden; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .buttons button { font: 700 21px/1.2 var(--font); padding: 15px 8px; border-radius: 10px; border: 0; cursor: pointer; color: #fff; }
  .approve { background: var(--ok); }
  .deny { background: var(--bad); }
  .buttons button:disabled { opacity: .5; }
  .empty { text-align: center; color: var(--muted); font-size: 20px; padding: 40px 10px; border: 1px dashed var(--line); border-radius: 14px; background: var(--surface); }
  .empty b { display: block; font-size: 40px; color: var(--ok); }
  form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  form label { display: block; font-weight: 700; font-size: 20px; margin-bottom: 10px; }
  form input { width: 100%; font: 400 28px/1.2 var(--num); padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--page); color: var(--text); letter-spacing: .2em; }
  form input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  form button { margin-top: 12px; width: 100%; font: 700 20px/1.2 var(--font); padding: 14px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); }
  form p { color: var(--bad); font-weight: 700; min-height: 1.4em; margin: 8px 0 0; }
  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 92vw;
    padding: 12px 20px; border-radius: 10px; font-weight: 700; font-size: 20px; color: #fff; background: var(--ok);
    box-shadow: 0 4px 18px rgba(0,0,0,.35); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 2000; }
  #toast.show { opacity: 1; }
  #toast.bad { background: var(--bad); }
  .leaflet-container { font-size: 13px; }
</style>
</head>
<body>
<div class="sim">SIMULATION<small>simulated vehicles and containers</small></div>
<header><a class="brand" href="./" aria-label="AXLR Bots"><img class="light" src="brand-light.svg" alt="AXLR Bots"><img class="dark" src="brand-dark.svg" alt=""></a><span class="pill" id="live" style="--tone:var(--idle)">connecting…</span></header>
<section id="incident" class="inc" hidden></section>
<main id="main"></main>
<div id="toast"></div>
<script>
const KEY = "approverCode";
const main = document.getElementById("main");
const cards = {};   // task + call -> {el, map, item}
let code = "", polling = null, ticking = null;

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function mmss(s) { s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function km(m) { return m >= 1000 ? (m / 1000).toFixed(1) + " km" : Math.round(m || 0) + " m"; }
function store(get, value) {
  try { if (get) return localStorage.getItem(KEY) || ""; if (value) localStorage.setItem(KEY, value); else localStorage.removeItem(KEY); } catch (e) { /* private mode */ }
  return "";
}
function live(text, tone) { const el = document.getElementById("live"); el.textContent = text; el.style.setProperty("--tone", tone); }
function toast(text, bad) {
  const t = document.getElementById("toast");
  t.textContent = text; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(t._h); t._h = setTimeout(() => { t.className = bad ? "bad" : ""; }, 2600);
}

// -- the code, asked once ---------------------------------------------------------
function askCode(message) {
  if (polling) { clearInterval(polling); polling = null; }
  for (const k of Object.keys(cards)) drop(k);
  main.innerHTML = `<form id="codeform"><label for="code">🔑 Approver code</label>
    <input id="code" type="password" inputmode="numeric" autocomplete="current-password" required>
    <button type="submit">Open</button><p>${esc(message || "")}</p></form>`;
  document.getElementById("codeform").addEventListener("submit", ev => {
    ev.preventDefault();
    code = document.getElementById("code").value.trim();
    if (!code) return;
    store(false, code);
    main.innerHTML = "";
    start();
  });
  document.getElementById("code").focus();
}

// -- the pending calls --------------------------------------------------------------
async function poll() {
  let r;
  try { r = await fetch("api/approvals", { headers: { "X-Approver-Code": code }, cache: "no-store" }); }
  catch (e) { live("⚠ offline", "var(--bad)"); return; }
  if (r.status === 401 || r.status === 403) { store(false, ""); askCode("Wrong code. Try again."); return; }
  if (!r.ok) { live(`⚠ error ${r.status}`, "var(--bad)"); return; }
  const items = await r.json();
  live("live · " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }), "var(--ok)");
  const keep = new Set();
  for (const it of items) {
    const k = it.task + "/" + it.call;
    keep.add(k);
    if (!cards[k]) add(k, it);
    cards[k].item = it;
    tick(cards[k]);
  }
  for (const k of Object.keys(cards)) if (!keep.has(k)) drop(k);
  const empty = document.getElementById("empty");
  if (!items.length && !empty) main.insertAdjacentHTML("beforeend", `<div class="empty" id="empty"><b>✓</b>Nothing waiting for you</div>`);
  if (items.length && empty) empty.remove();
}

function add(k, it) {
  const m = it.mission || {};
  const el = document.createElement("div");
  el.className = "card";
  const pattern = m.pattern ? m.pattern.replace(/_/g, " ") : "waypoints";
  el.innerHTML = `<div class="top"><span class="who">${it.vehicle && it.vehicle.startsWith("plane") ? "✈️" : it.vehicle && it.vehicle.startsWith("quad") ? "🚁" : "🚙"} ${esc(it.vehicle || it.bot)}</span><span class="left"></span></div>
    <div class="mission">${esc(m.name || it.tool)}</div>
    <div class="facts"><div><span>pattern</span>${esc(pattern)}</div><div><span>waypoints</span>${esc(m.waypoints ?? "–")}</div>
      <div><span>distance</span>${km(m.distance_m)}</div><div><span>altitude</span>${m.alt_m ? esc(m.alt_m) + " m" : "ground"}</div>
      <div><span>photo every</span>${m.photo_every_m ? esc(m.photo_every_m) + " m" : "no photos"}</div><div><span>bot</span>${esc(it.bot)}</div></div>
    <div class="why">${esc(it.objective)}</div>
    <div class="mini"></div>
    <div class="buttons"><button class="approve">✓ Approve</button><button class="deny">✕ Deny</button></div>`;
  main.prepend(el);
  const card = cards[k] = { el, map: null, item: it };
  el.querySelector(".approve").addEventListener("click", () => decide(k, "approve"));
  el.querySelector(".deny").addEventListener("click", () => decide(k, "deny"));
  const route = (it.route || []).filter(p => Array.isArray(p) && p.length >= 2);
  if (route.length) {
    const map = L.map(el.querySelector(".mini"), { zoomControl: false, attributionControl: true, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, boxZoom: false, keyboard: false });
    map.attributionControl.setPrefix(false);
    L.tileLayer("https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0/Actueel_orthoHR/EPSG:3857/{z}/{x}/{y}.jpeg", { maxZoom: 21, maxNativeZoom: 20, attribution: "Luchtfoto © Beeldmateriaal Nederland / PDOK (CC BY 4.0)" }).addTo(map);
    L.polyline(route.concat([route[0]]), { color: "#111111", weight: 6, opacity: 0.55 }).addTo(map);
    L.polyline(route, { color: "#F4F4F2", weight: 2.5, dashArray: "6 8" }).addTo(map);
    L.circleMarker(route[0], { radius: 7, color: "#fff", weight: 3, fillColor: "#2E7D4F", fillOpacity: 1 }).bindTooltip("home", { permanent: true, direction: "right", className: "lbl" }).addTo(map);
    map.fitBounds(L.latLngBounds(route).pad(0.15));
    card.map = map;
  }
}

function drop(k) {
  const c = cards[k]; if (!c) return;
  if (c.map) c.map.remove();
  c.el.remove();
  delete cards[k];
}

function tick(c) {
  const left = (c.item.deadline || 0) - Date.now() / 1000;
  const el = c.el.querySelector(".left");
  el.textContent = left > 0 ? "⏱ " + mmss(left) : "expired";
  el.className = "left" + (left < 120 ? " late" : "");
}

async function decide(k, what) {
  const c = cards[k]; if (!c) return;
  const buttons = c.el.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  const it = c.item;
  let ok = false, error = "";
  try {
    const r = await fetch(`api/approvals/${encodeURIComponent(it.task)}/${what}?call=${encodeURIComponent(it.call)}`, { method: "POST", headers: { "X-Approver-Code": code } });
    if (r.status === 401 || r.status === 403) { store(false, ""); askCode("Wrong code. Try again."); return; }
    const body = await r.json().catch(() => ({}));
    ok = r.ok && body.ok !== false;
    error = body.error || (r.ok ? "" : `error ${r.status}`);
  } catch (e) { error = "offline"; }
  if (ok) { toast(what === "approve" ? `✓ ${it.vehicle || it.bot}: approved` : `✕ ${it.vehicle || it.bot}: denied`, what !== "approve"); drop(k); }
  else { toast("⚠ " + (error || "not done"), true); buttons.forEach(b => b.disabled = false); }
}

// -- the incident counter --------------------------------------------------------------
async function incident() {
  try {
    const f = await (await fetch("api/fleet", { cache: "no-store" })).json();
    const i = f.incident, box = document.getElementById("incident");
    if (!i) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<div class="t">${i.status === "ended" ? "✓ Search ended" : "⚠ " + esc(i.title || i.total + " containers overboard")}</div>
      <div class="big three"><div class="found"><b>${i.found}/${i.total}</b><span>found</span></div><div><b>${mmss(i.elapsed_s)}</b><span>time</span></div>
      <div><b>$${((i.cost || {}).total_usd || 0).toFixed(2)}</b><span>model</span></div></div>`;
  } catch (e) { /* the counter waits for the next round */ }
}

function start() {
  poll();
  polling = setInterval(() => { poll(); }, 2000);
  if (!ticking) ticking = setInterval(() => { for (const c of Object.values(cards)) tick(c); }, 1000);
}

incident();
setInterval(incident, 3000);
code = store(true);
if (code) start(); else askCode();
</script>
</body>
</html>
