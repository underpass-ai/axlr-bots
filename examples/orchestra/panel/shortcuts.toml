# The conductor's backup: three buttons on the team orchestra's page in
# the desktop panel (Teams → orchestra → Shortcuts). Each press publishes
# the event at once, as the operator, with a key of its own.
# Copy to ~/.config/axlr-bots-panel/shortcuts.toml and restart the panel.

[[shortcut]]
team = "orchestra"
label = "Strings"
name = "info.cue.strings"
message = "Strings, come in."
data = { dynamics = "f" }

[[shortcut]]
team = "orchestra"
label = "Winds"
name = "info.cue.winds"
message = "Winds, come in."
data = { dynamics = "f" }

[[shortcut]]
team = "orchestra"
label = "Stop all"
name = "stop.all"
message = "Stop."

