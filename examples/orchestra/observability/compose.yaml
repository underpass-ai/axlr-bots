# The orchestra's observability on one host: Prometheus, Grafana, and the team
# exporter (the control plane's records as metrics). Everything on the host's
# network, bound to 127.0.0.1: Prometheus scrapes the score service on
# 127.0.0.1:8790 (and a test instance on 8795), Grafana is http://127.0.0.1:3000.
#
#   cp grafana.env.example grafana.env    # then set GF_SECURITY_ADMIN_PASSWORD
#   docker compose up -d
#
# See README.md. Images pinned by tag and digest (multi-arch: gx10 is arm64).
name: orchestra-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.12@sha256:28476aa8096cd8d0f658a05a443b605fffb450e57f444335216175d604cfd23d
    network_mode: host
    env_file: grafana.env
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/conductor.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # The control plane has no /metrics: this reads its operator API (GET only)
  # with the operator token, mounted read-only. The user's uid reads the token
  # (0600); set ORCHESTRA_UID/ORCHESTRA_GID if it is not 1000.
  team-exporter:
    image: python:3.13-slim@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
    network_mode: host
    user: "${ORCHESTRA_UID:-1000}:${ORCHESTRA_GID:-1000}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - /app/team_exporter.py
      - --control-plane=${CONTROL_PLANE:-https://127.0.0.1:7879}
      - --team=${TEAM:-orchestra}
      - --token-file=/run/axlr/api.token
      - --ca-file=/run/axlr/ca.crt
      - --listen=127.0.0.1:8797
    volumes:
      - ../score-service:/app:ro
      - ${AXLR_BOTS_STATE:-${HOME}/.local/state/axlr-bots}/api.token:/run/axlr/api.token:ro
      - ${AXLR_BOTS_STATE:-${HOME}/.local/state/axlr-bots}/ca/ca.crt:/run/axlr/ca.crt:ro
    restart: unless-stopped

volumes:
  prometheus: {}
  grafana: {}
