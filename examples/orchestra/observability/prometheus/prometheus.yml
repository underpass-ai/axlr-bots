# Every five seconds: a take is ten minutes, a gesture a second.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

scrape_configs:
  # The score service the headset conducts (server.py, 127.0.0.1:8790), read
  # only: /metrics changes nothing. Down until it runs a version with /metrics.
  - job_name: score
    static_configs:
      - targets: ["127.0.0.1:8790"]

  # A second score service to try things on, apart from the live one:
  #   server.py --listen 127.0.0.1:8795 --hands-dry-run   (observability/rehearse.py drives it)
  - job_name: score-test
    static_configs:
      - targets: ["127.0.0.1:8795"]

  # The team's tasks, deliveries, failures and budgets, from the control plane's records.
  - job_name: team
    static_configs:
      - targets: ["127.0.0.1:8797"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
