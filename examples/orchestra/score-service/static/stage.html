<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra stage</title>
<link rel="stylesheet" href="/static/stage.css">
</head>
<body>
<!-- The stage: 36 chairs, each one bot, lit from what the score service
     says each chair did (enter, stop), never from a guess; the score strip
     with its playhead; the conductor's last event on the bus, as published.
     ?hud=0 keeps only the stage and the SIMULATION ribbon, for a recording;
     ?theme=dark or light. It reads GET /api/state by long-poll. -->
<div class="sim" id="sim">SIMULATION</div>
<header class="hud" id="top">
  <div class="title"><b>36 bots. Mozart.</b> <span class="muted" id="work">Symphony No. 25, K. 183</span></div>
  <div class="nums">
    <span>take <b class="num" id="take">–</b></span>
    <span>bar <b class="num" id="bar">–</b><span class="muted num" id="bars"></span></span>
    <span><b class="num" id="bpm">–</b> bpm</span>
    <span><b class="num" id="playing">0</b>/36 playing</span>
    <span class="pill" id="status">idle</span>
  </div>
</header>
<svg id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The orchestra's 36 chairs and the score">
  <g id="strip"></g>
  <g id="seats"></g>
  <g id="podium"></g>
</svg>
<footer class="hud" id="bottom">
  <div id="event" class="event"><span class="muted">the conductor's last event on the bus appears here, as published</span></div>
  <div id="cut" class="cut"></div>
  <div class="label muted" id="label"></div>
</footer>
<script src="/static/stage.js"></script>
</body>
</html>
