# NATS for the orchestra: the control plane publishes the pushes, each
# chair's node reads its own subject. The bus port's rule 6
# (docs/architecture/bus-port.md). Users and passwords are placeholders,
# for one host: on a cluster the users are TLS client certificates
# (verify_and_map), see examples/helm/orchestra/templates/nats.yaml.
#
#   docker run -d --name axlr-nats -p 127.0.0.1:4222:4222 \
#     -v $PWD/nats.conf:/etc/nats/nats.conf:ro container-registry.underpassai.com/nats:2.15.0 \
#     -c /etc/nats/nats.conf
#
# The images come only from container-registry.underpassai.com; mirror
# nats:2.15.0 there first.

listen: 127.0.0.1:4222
jetstream { store_dir: /data }

accounts {
  AXLR {
    jetstream: enabled
    users: [
      # The control plane: defines the stream, publishes every push.
      { user: control-plane, password: $CP_PASSWORD,
        permissions: { publish: ["axlr.push.>", "$JS.API.>"], subscribe: ["_INBOX.>"] } }
      # One user per node: its own subject and its own consumer, nothing else.
      { user: stage-ob-1, password: $OB1_PASSWORD,
        permissions: {
          publish: ["$JS.API.STREAM.INFO.AXLR_PUSH", "$JS.API.CONSUMER.CREATE.AXLR_PUSH.node-stage-ob-1.axlr.push.stage-ob-1",
                    "$JS.API.CONSUMER.INFO.AXLR_PUSH.node-stage-ob-1", "$JS.API.CONSUMER.MSG.NEXT.AXLR_PUSH.node-stage-ob-1", "$JS.ACK.AXLR_PUSH.node-stage-ob-1.>"],
          subscribe: ["_INBOX.>"] } }
    ]
  }
}
