apiVersion: v1
kind: Namespace
metadata: {name: drift-lab}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: drift-lab, labels: {app: web}}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: docker.io/library/nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
