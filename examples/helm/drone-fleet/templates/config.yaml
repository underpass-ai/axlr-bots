apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
data:
  zones.json: |
    {{- dict "zones" .Values.zones | toPrettyJson | nindent 4 }}
  layout.json: |
    {{- dict "depot" .Values.base.depot "rtk" .Values.base.rtk "stations" .Values.base.stations "coast" .Values.incident.coast | toPrettyJson | nindent 4 }}
  router.conf: |
    {{- .Files.Get "files/router.conf" | nindent 4 }}
  quad.parm: |
    {{- .Files.Get "files/quad.parm" | nindent 4 }}
  rover.parm: |
    {{- .Files.Get "files/rover.parm" | nindent 4 }}
  plane.parm: |
    {{- .Files.Get "files/plane.parm" | nindent 4 }}
  {{- range .Values.vehicles }}
  {{- if .params }}
  # The {{ .name }} group's own parameters, after its kind's.
  {{ .name }}-group.parm: |
    {{- range $k, $v := .params }}
    {{ $k }} {{ $v }}
    {{- end }}
  {{- end }}
  {{- end }}
  # AXLR's MCP configuration for each vehicle's sidecar: the pilot's tool on
  # loopback, every call asking a person (approval manual).
  mcp.json: |
    {"version": 1, "plugins": [{"manifest": "/var/lib/axlr-node/home/.config/axlr/plugins/vehicle.json", "name": "vehicle", "description": "the vehicle's companion computer", "purpose": "tools", "approval": "manual"}]}
  vehicle.json: |
    {"manifest_version": 1, "id": "vehicle", "url": "http://127.0.0.1:8765/mcp", "allow_tools": ["run_mission"]}
