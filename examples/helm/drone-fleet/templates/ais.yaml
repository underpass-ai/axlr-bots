{{- if .Values.ais.enabled }}
{{- $v := index .Values "axlr-bots-node" }}
# The fleet's AIS receiver: the one connection to aisstream.io, the ships
# served to the base over HTTP (ais.py). Its own Deployment and Service, so
# "the ais service" names one thing.
apiVersion: v1
kind: Service
metadata:
  name: ais
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
    {{- include "fleet.aisLabels" . | nindent 4 }}
spec:
  selector: {app: ais}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ais
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
    {{- include "fleet.aisLabels" . | nindent 4 }}
spec:
  replicas: 1
  # One connection per key: never two receivers at once.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ais}
  template:
    metadata:
      labels:
        app: ais
        {{- include "fleet.labels" . | nindent 8 }}
        {{- include "fleet.aisLabels" . | nindent 8 }}
    spec:
      {{- include "fleet.podSpecCommon" . | nindent 6 }}
      containers:
        - name: ais
          image: {{ .Values.images.app }}
          command: ["python", "/app/ais.py"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: AIS_KEY_FILE, value: /etc/fleet-secrets/ais/AISSTREAM_API_KEY}
            - {name: AIS_BBOX, value: {{ .Values.ais.bbox | quote }}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          securityContext:
            {{- include "fleet.restricted" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.ais | nindent 12 }}
          volumeMounts:
            - {name: secret-ais, mountPath: /etc/fleet-secrets/ais, readOnly: true}
      volumes:
        - name: secret-ais
          secret: {secretName: {{ .Values.ais.secret }}, optional: true, defaultMode: 0440}
---
# Only the base reads the ships; the receiver reaches DNS and HTTPS outside
# the cluster. A NetworkPolicy cannot name a host, so "only
# stream.aisstream.io" is ais.egress's ranges (the public internet by
# default), never the cluster's or the lab's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ais
  labels:
    {{- include "fleet.labels" . | nindent 4 }}
    {{- include "fleet.aisLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: ais}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: {{ include "fleet.base" . }}}}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $v.networkPolicy.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $v.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        {{- range .Values.ais.egress.cidrs }}
        - ipBlock:
            cidr: {{ . }}
            {{- with $.Values.ais.egress.except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
{{- end }}
