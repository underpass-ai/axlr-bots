{{- $nats := include "orchestra.nats" . }}
{{- $names := splitList "," (include "orchestra.svcNames" (list $nats .Release.Namespace)) }}
# The broker's own CA (a self-signed root cert-manager makes and keeps
# here) and the broker's certificate. Clients check the broker against it;
# the broker checks clients against the fleet CA.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $nats }}-selfsigned
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $nats }}-ca
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ $nats }} CA
  secretName: {{ $nats }}-ca
  duration: 87600h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: {{ $nats }}-selfsigned, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $nats }}-ca
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ $nats }}-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $nats }}-tls
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  secretName: {{ $nats }}-tls
  commonName: {{ $nats }}
  dnsNames:
    {{- range $names }}
    - {{ . }}
    {{- end }}
  duration: {{ .Values.nats.certManager.duration }}
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  usages: [server auth, digital signature]
  issuerRef: {name: {{ $nats }}-ca, kind: Issuer}
---
# The bus port's rule 6 (docs/architecture/bus-port.md): only the control
# plane publishes; each node reads its own consumer. Users are the
# certificates' subjects (verify_and_map): the control plane's from
# ca issue-client, each node's from its enrollment. A fleet certificate
# whose subject is not listed is refused.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $nats }}
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
data:
  nats.conf: |
    server_name: {{ $nats }}
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222
    max_payload: 64KB
    jetstream {
      store_dir: /data
      max_memory_store: 64MB
      max_file_store: {{ .Values.nats.maxFileStore }}
    }
    tls {
      cert_file: /etc/nats/tls/tls.crt
      key_file: /etc/nats/tls/tls.key
      ca_file: /etc/nats/clients/ca.crt
      verify_and_map: true
      timeout: 2
    }
    accounts {
      AXLR {
        jetstream: enabled
        users: [
          { user: "CN=control-plane,O=axlr-bots clients",
            permissions: { publish: ["axlr.push.>", "$JS.API.>"], subscribe: ["_INBOX.>"] } }
          {{- range $id := include "orchestra.nodeIDs" . | fromJsonArray }}
          { user: "CN={{ $id }},O=axlr-bots nodes",
            permissions: {
              publish: ["$JS.API.STREAM.INFO.AXLR_PUSH", "$JS.API.CONSUMER.CREATE.AXLR_PUSH.node-{{ $id }}.axlr.push.{{ $id }}",
                        "$JS.API.CONSUMER.INFO.AXLR_PUSH.node-{{ $id }}", "$JS.API.CONSUMER.MSG.NEXT.AXLR_PUSH.node-{{ $id }}",
                        "$JS.ACK.AXLR_PUSH.node-{{ $id }}.>"],
              subscribe: ["_INBOX.>"] } }
          {{- end }}
        ]
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $nats }}
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  selector: {app: {{ $nats }}}
  ports:
    - {name: client, port: 4222, targetPort: client}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $nats }}
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  serviceName: {{ $nats }}
  replicas: 1
  selector:
    matchLabels: {app: {{ $nats }}}
  template:
    metadata:
      labels:
        app: {{ $nats }}
        {{- include "orchestra.labels" . | nindent 8 }}
      annotations:
        # The users change with the chairs: restart the broker to read them.
        checksum/users: {{ include "orchestra.nodeIDs" . | sha256sum }}
    spec:
      {{- include "orchestra.podSpecCommon" . | nindent 6 }}
      containers:
        - name: nats
          image: {{ .Values.images.nats }}
          args: ["--config", "/etc/nats/nats.conf"]
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          readinessProbe:
            httpGet: {path: "/healthz?js-enabled-only=true", port: monitor}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: monitor}
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            {{- include "orchestra.restricted" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.nats | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/nats/nats.conf, subPath: nats.conf, readOnly: true}
            - {name: tls, mountPath: /etc/nats/tls, readOnly: true}
            - {name: clients, mountPath: /etc/nats/clients, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ $nats }}}
        - name: tls
          secret:
            secretName: {{ $nats }}-tls
            items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
        # The fleet CA: bootstrap.sh copies it from the control plane.
        - name: clients
          configMap:
            name: {{ .Values.secrets.fleetCA }}
            items: [{key: ca.crt, path: ca.crt}]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.nats.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.storage | quote }}
