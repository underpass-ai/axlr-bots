{{- $v := index .Values "axlr-bots-node" }}
{{- $cp := include "orchestra.cp" . }}
{{- $nats := include "orchestra.nats" . }}
{{- $score := include "orchestra.score" . }}
{{- $rave := include "orchestra.rave" . }}
{{- define "orchestra.dns" -}}
- to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
  ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
{{- end }}
{{- define "orchestra.fromIngress" -}}
- namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
{{- end }}
# The broker: the control plane and the chairs' nodes on 4222 (TLS, a
# client certificate required); it dials nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $nats }}
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: {{ $nats }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: {{ $cp }}}}
        - podSelector: {matchLabels: {orchestra.underpass.ai/chair: "true"}}
      ports:
        - {protocol: TCP, port: 4222}
  egress: []
---
# The control plane: nodes on 7878, the score service on 7879; it dials the
# broker and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $cp }}
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: {{ $cp }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {orchestra.underpass.ai/chair: "true"}}
      ports:
        - {protocol: TCP, port: 7878}
    - from:
        - podSelector: {matchLabels: {app: {{ $score }}}}
      ports:
        - {protocol: TCP, port: 7879}
  egress:
    {{- include "orchestra.dns" . | nindent 4 }}
    - to:
        - podSelector: {matchLabels: {app: {{ $nats }}}}
      ports:
        - {protocol: TCP, port: 4222}
{{- if .Values.chairs.enabled }}
---
# The chairs' nodes: the sidecar's egress (DNS, the control plane, the
# broker, Jev over HTTPS) and the score service's MCP. Nothing dials them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-chairs
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {orchestra.underpass.ai/chair: "true"}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- include "axlr-bots-node.inject.egress" (dict "values" $v "root" $) | nindent 4 }}
    - to:
        - podSelector: {matchLabels: {app: {{ $score }}}}
      ports:
        - {protocol: TCP, port: 8790}
{{- end }}
{{- if .Values.score.enabled }}
---
# The score service: the ingress controller and the chairs on 8790; it
# dials the control plane's operator API, DNS and Jev over HTTPS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $score }}
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: {{ $score }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "orchestra.fromIngress" . | nindent 8 }}
        - podSelector: {matchLabels: {orchestra.underpass.ai/chair: "true"}}
      ports:
        - {protocol: TCP, port: 8790}
  egress:
    {{- include "orchestra.dns" . | nindent 4 }}
    - to:
        - podSelector: {matchLabels: {app: {{ $cp }}}}
      ports:
        - {protocol: TCP, port: 7879}
    # Jev (api.typesafe.ai): HTTPS to the internet, nothing private.
    - to:
        {{- range $v.networkPolicy.modelProvider.cidrs }}
        - ipBlock:
            cidr: {{ . }}
            except:
              {{- toYaml $v.networkPolicy.modelProvider.except | nindent 14 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
{{- end }}
{{- if .Values.rave.enabled }}
---
# The rave: the ingress controller on 8794; it dials nothing (the samples
# are in its image).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rave }}
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: {{ $rave }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "orchestra.fromIngress" . | nindent 8 }}
      ports:
        - {protocol: TCP, port: 8794}
  egress: []
{{- end }}
