{{- if .Values.chairs.enabled }}
{{- $root := . }}
{{- $v := index .Values "axlr-bots-node" }}
{{- $bots := dict "values" $v "root" $root }}
{{- $score := include "orchestra.score" . }}
{{- if ne $v.node.idPrefix .Values.chairs.nodePrefix }}{{ fail "axlr-bots-node.node.idPrefix and chairs.nodePrefix must be the same: the bots are placed on <prefix><chair>" }}{{ end }}
{{- range $i, $s := .Values.chairs.sections }}
{{- if $i }}
---
{{- end }}
# Section {{ $s.id }}: its pods are its chairs ({{ $s.id }}-1 … {{ $s.id }}-{{ $s.chairs }}), each
# one node ({{ $root.Values.chairs.nodePrefix }}{{ $s.id }}-<n>) that reads the score's tools for its chair.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $s.id }}
  labels:
    {{- include "orchestra.labels" $root | nindent 4 }}
spec:
  # No Service: nothing dials a chair; the node dials out.
  serviceName: {{ $s.id }}
  {{- $replicas := ternary $s.chairs $s.replicas (not (hasKey $s "replicas")) }}
  {{- if gt (int $replicas) (int $s.chairs) }}{{ fail (printf "chairs.sections %s: %d replicas, %d chairs" $s.id (int $replicas) (int $s.chairs)) }}{{ end }}
  replicas: {{ $replicas }}
  ordinals: {start: 1}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: {{ $s.id }}}
  template:
    metadata:
      labels:
        app: {{ $s.id }}
        orchestra.underpass.ai/chair: "true"
        {{- include "orchestra.labels" $root | nindent 8 }}
    spec:
      {{- include "orchestra.podSpecCommon" $root | nindent 6 }}
      initContainers:
        # The node's AXLR configuration, in its HOME on the state volume: the
        # score service's MCP for this chair, the server a Jev bot's program
        # names (score).
        - name: mcp-config
          image: {{ $root.Values.images.controlPlane }}
          env:
            - name: CHAIR
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          command:
            - /busybox/sh
            - -c
            - |
              set -eu
              dir=/state/home/.config/axlr
              mkdir -p "$dir/plugins"
              printf '{"manifest_version": 1, "id": "score", "url": "http://{{ $score }}:8790/mcp/%s", "allow_tools": ["*"]}\n' "$CHAIR" > "$dir/plugins/score.json"
              printf '{"version": 1, "plugins": [{"manifest": "/var/lib/axlr-node/home/.config/axlr/plugins/score.json", "name": "score", "description": "the score service: this chair'"'"'s part", "purpose": "tools", "approval": "auto"}]}\n' > "$dir/mcp.json"
              chmod 0600 "$dir/mcp.json" "$dir/plugins/score.json"
          securityContext:
            {{- include "orchestra.restricted" $root | nindent 12 }}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          volumeMounts:
            - {name: axlr-node-state, mountPath: /state}
      containers:
        {{- include "axlr-bots-node.inject.container" $bots | nindent 8 }}
      volumes:
        {{- include "axlr-bots-node.inject.volumes" $bots | nindent 8 }}
  volumeClaimTemplates:
    {{- include "axlr-bots-node.inject.volumeClaimTemplate" $bots | nindent 4 }}
{{- end }}
{{- end }}
