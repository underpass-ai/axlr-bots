{{- $cp := include "orchestra.cp" . }}
{{- $nats := include "orchestra.nats" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $cp }}
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  selector: {app: {{ $cp }}}
  ports:
    - {name: nodes, port: 7878, targetPort: nodes}
    - {name: api, port: 7879, targetPort: api}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $cp }}
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
spec:
  serviceName: {{ $cp }}
  replicas: 1
  selector:
    matchLabels: {app: {{ $cp }}}
  template:
    metadata:
      labels:
        app: {{ $cp }}
        {{- include "orchestra.labels" . | nindent 8 }}
    spec:
      {{- include "orchestra.podSpecCommon" . | nindent 6 }}
      initContainers:
        # The fleet CA, once: nodes enroll against it, the operator API uses it,
        # and the broker checks every client's certificate against it.
        - name: ca-init
          image: {{ include "orchestra.image" (list . "controlPlane") }}
          command: ["/busybox/sh", "-c", "test -f /var/lib/axlr-bots/ca/ca.crt || /usr/local/bin/axlr-bots --state /var/lib/axlr-bots ca init"]
          securityContext:
            {{- include "orchestra.restricted" . | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/axlr-bots}
        # The control plane's own certificate for the broker, once:
        # CN=control-plane,O=axlr-bots clients, the one user that publishes.
        - name: nats-client
          image: {{ include "orchestra.image" (list . "controlPlane") }}
          command: ["/busybox/sh", "-c", "test -f /var/lib/axlr-bots/nats-client/client.key || /usr/local/bin/axlr-bots --state /var/lib/axlr-bots ca issue-client --name control-plane --out /var/lib/axlr-bots/nats-client"]
          securityContext:
            {{- include "orchestra.restricted" . | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/axlr-bots}
      containers:
        - name: control-plane
          image: {{ include "orchestra.image" (list . "controlPlane") }}
          args:
            - serve
            - --listen=0.0.0.0:7878
            # 127.0.0.1 and localhost: the panel through kubectl port-forward.
            - --server-names={{ include "orchestra.svcNames" (list $cp .Release.Namespace) }},127.0.0.1,localhost
            - --api-listen=0.0.0.0:7879
            - --bus=nats
            - --nats-url=tls://{{ $nats }}:4222
            - --nats-cert=/var/lib/axlr-bots/nats-client/client.crt
            - --nats-key=/var/lib/axlr-bots/nats-client/client.key
            - --nats-ca=/etc/axlr-bots/nats-ca/ca.crt
          ports:
            - {name: nodes, containerPort: 7878}
            - {name: api, containerPort: 7879}
          readinessProbe:
            tcpSocket: {port: nodes}
            periodSeconds: 10
          securityContext:
            {{- include "orchestra.restricted" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.controlPlane | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/axlr-bots}
            - {name: tmp, mountPath: /tmp}
            - {name: nats-ca, mountPath: /etc/axlr-bots/nats-ca, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        # The broker's CA, never its key.
        - name: nats-ca
          secret:
            secretName: {{ $nats }}-tls
            items: [{key: ca.crt, path: ca.crt}]
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.controlPlane.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.controlPlane.storage | quote }}
